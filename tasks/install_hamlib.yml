- name: Install hamlib
  hosts: all
  environment:
    # Build-Time Tuning:
    CXXFLAGS: -O2 -march=native -mtune=native
    CFLAGS: -O2 -march=native -mtune=native
    MAKEFLAGS: -j {{ shackwright_make_jobs }}
  tasks:

    - name: Create directory hamradio
      file:
        path: /home/{{ ham_user }}/hamradio
        state: directory

    - name: Install dependent libraries (Common)
      become: yes
      package:
        name: "{{ item }}"
        state: present
      with_items:
        - build-essential
        - git
        - libtool
        - libfltk1.3-dev
        - libsamplerate0-dev
        - portaudio19-dev
        - libsndfile1-dev
        - libxft-dev
        - libxinerama-dev
        - libxcursor-dev
        - libpulse-dev
        - pavucontrol
        - swig
        - libusb-1.0-0-dev
        - libreadline-dev
        - libxml2-dev
        - libgd-dev
        # These three were previously listed only under Bullseye, Jammy and
        # Inovato. Bookworm and Trixie matched none of those branches and so
        # installed neither, while ./configure is still asked for
        # --with-python-binding. Without python3-dev the bindings fail to
        # build. They are common dependencies, so they belong here.
        - python3-dev
        - libnova-dev
        - libindi-dev
      retries: 5
      delay: 30
      register: result
      until: result.failed == false

    # Deliberately unpinned. This tracks Hamlib's development branch, which
    # is where new rig backends land, and rig support is the entire reason to
    # build Hamlib from source instead of installing Debian's. For reference:
    # Debian trixie ships 4.6.2, the current Hamlib release is 4.7.2, and
    # master is ahead of both. A radio released last month is supported here
    # and in neither of the others.
    #
    # The cost is that two builds a week apart are not the same build. That is
    # recorded rather than removed. The commit is printed below, so it lands
    # in ansible-output/install_hamlib.log, and the built version appears in
    # the image manifest. If a bad commit ever lands upstream, an operator can
    # pin without editing this file:
    #
    #   ./run_shackwright -e hamlib_version=4.7.2
    #   ./run_shackwright -e hamlib_version=<commit sha>
    - name: Git clone latest Hamlib sources
      git:
        repo: https://github.com/Hamlib/Hamlib.git
        dest: /home/{{ ham_user }}/hamradio/hamlib
        version: "{{ hamlib_version | default(omit) }}"
      retries: 5
      delay: 30
      register: hamlib_clone
      until: hamlib_clone.failed == false

    - name: Record which Hamlib commit is being built
      ansible.builtin.debug:
        msg: >-
          Hamlib commit {{ hamlib_clone.after | default('unknown') }}
          {{ '(pinned to ' ~ hamlib_version ~ ')' if hamlib_version is defined
             else '(tracking the development branch)' }}

    - name: Bootstrap Hamlib
      command: ./bootstrap
      args:
        chdir: /home/{{ ham_user }}/hamradio/hamlib

    # This was four near-identical tasks, one per distribution release, each
    # hardcoding the Python version that release happened to ship: 3.9 for
    # Bullseye, 3.10 for Jammy, 3.11 for Bookworm. Trixie ships 3.13 and
    # matched none of them, so ./configure never ran, no Makefile was
    # generated, and the build failed at "make all". Hamlib underpins most of
    # HamPi, so that took the whole run down with it.
    #
    # Asking the target which Python it actually runs is correct on every
    # release, including ones that do not exist yet.
    - name: Configure Hamlib
      ansible.builtin.command:
        cmd: >-
          ./configure
          PYTHON_VERSION={{ ansible_python_version.split('.')[0:2] | join('.') }}
          --with-python-binding
          --with-xml-support
        chdir: /home/{{ ham_user }}/hamradio/hamlib

    - name: Build Hamlib
      command: make all
      args:
        chdir: /home/{{ ham_user }}/hamradio/hamlib

    - name: Install Hamlib
      become: yes
      command: make install
      args:
        chdir: /home/{{ ham_user }}/hamradio/hamlib

    - name: Build Hamlib Python bindings
      command: make
      args:
        chdir: /home/{{ ham_user }}/hamradio/hamlib/bindings

    - name: Install Hamlib Python bindings
      become: yes
      command: make install
      args:
        chdir: /home/{{ ham_user }}/hamradio/hamlib/bindings

    - name: Configure dynamic linker run-time bindings
      become: yes
      command: ldconfig

    - name: Remove Hamlib build directory
      file:
        path: /home/{{ ham_user }}/hamradio/hamlib
        state: absent
