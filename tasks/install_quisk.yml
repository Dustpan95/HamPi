- name: Install Quisk Software
  hosts: all
  gather_facts: no
  tasks:

  # Quisk was installed with "pip install quisk", which compiles C extensions
  # against portaudio, ALSA, PulseAudio and FFTW at install time. On a Debian
  # that enforces PEP 668 this needs --break-system-packages to proceed at
  # all, and it then drops a compiled, unmanaged Python package into
  # /usr/lib/python3/dist-packages where apt cannot see or upgrade it.
  #
  # Debian packages Quisk, built against the same libraries, so let apt own
  # it. The nine -dev packages the source build needed are no longer
  # installed: they were build dependencies for a build that no longer
  # happens.
  - name: Install Quisk
    become: yes
    ansible.builtin.package:
      name: quisk
      state: present
    retries: 5
    delay: 30
    register: result
    until: result.failed == false

  # The project's own desktop entry files Quisk under HamRadio in the menu,
  # which is the point of the menu work elsewhere in this tree.
  - name: Copy quisk desktop file
    become: yes
    ansible.builtin.copy:
      src: "{{ playbook_dir }}/../files/usr/share/applications/quisk.desktop"
      dest: "/usr/share/applications/quisk.desktop"
      mode: '0644'
