---
name: Build Raspberry Pi image

# Builds a flashable Raspberry Pi OS image on a native arm64 runner.
#
# No Raspberry Pi is involved. The official Raspberry Pi OS image is
# downloaded, grown, loop-mounted, and the playbook is run against it through
# Ansible's chroot connection. Because the runner is aarch64 and so is the
# image, this is native execution -- no QEMU, no emulation penalty.
#
# Manual only. A job is capped at six hours; the app list is an input so a
# run can be sized to fit.

on:
  # Dispatching a workflow needs actions: write, which is not available here,
  # so a path-filtered push on this file is the only way to start a run. One
  # run per edit, nothing else.
  push:
    branches: [BetaTesting]
    paths: ['.github/workflows/build-image.yml']
  workflow_dispatch:
    inputs:
      playbooks:
        description: 'Comma-separated playbooks under tasks/ to install'
        required: true
        default: >-
          install_cmake,install_soapy,install_hamlib,install_chirp,
          install_quisk,install_qdmr_gui_dmr_radio_programmer,
          install_voacapl,install_flxmlrpc,install_flnet,
          install_fldigi,install_pat,install_hamrs
      image_size:
        description: 'Grow the image to this size before installing'
        required: false
        default: '16G'
      base_image:
        description: 'Base image: raspios_arm64_latest (desktop) or raspios_lite_arm64_latest'
        required: false
        default: 'raspios_arm64_latest'

permissions:
  # write, because a successful build publishes its image as a release.
  contents: write

jobs:
  image:
    name: Build image on native arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    env:
      MNT: /mnt/shackwright
      IMG: shackwright.img
      # What a push-triggered run installs. Chosen to exercise every repair
      # made to the playbooks rather than to build a complete station: the
      # packaged installs (chirp, quisk, qdmr, voacapl), the shared w1hkj
      # source build on a small program and a large one (flnet, fldigi), the
      # GitHub releases API lookup and architecture selection (pat), and the
      # AppImage lookup (hamrs). install_cmake goes first because it now
      # installs the toolchain the rest depend on instead of removing it.
      DEFAULT_PLAYBOOKS: >-
        install_cmake,install_soapy,install_hamlib,install_chirp,
        install_quisk,install_qdmr_gui_dmr_radio_programmer,
        install_voacapl,install_flxmlrpc,install_flnet,
        install_fldigi,install_pat,install_hamrs

    steps:
      - uses: actions/checkout@v4

      - name: Report the machine
        run: |
          echo "arch: $(uname -m), $(nproc) cores, \
          $(free -g | awk '/Mem:/{print $2}') GB RAM"
          df -h / | tail -1

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: Install host tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq parted xz-utils e2fsprogs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Ansible and collections
        run: |
          python3 -m pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Download the base Raspberry Pi OS image
        run: |
          url="https://downloads.raspberrypi.com/${{ inputs.base_image || 'raspios_arm64_latest' }}"
          echo "Resolving ${url}"
          curl -fsSIL "$url" | grep -i '^location:' | tail -1
          curl -fL --retry 3 -o base.img.xz "$url"
          ls -lh base.img.xz
          echo "Decompressing ..."
          xz -d --stdout base.img.xz > "$IMG"
          rm -f base.img.xz
          ls -lh "$IMG"

      - name: Grow the image and its root filesystem
        id: mount
        run: |
          set -x
          # The stock image is sized to its contents; the applications need room.
          truncate -s "${{ inputs.image_size || '16G' }}" "$IMG"
          sudo parted -s "$IMG" resizepart 2 100%

          loop=$(sudo losetup -Pf --show "$IMG")
          echo "loop=$loop" >> "$GITHUB_OUTPUT"
          sudo e2fsck -pf "${loop}p2" || true
          sudo resize2fs "${loop}p2"

          sudo mkdir -p "$MNT"
          sudo mount "${loop}p2" "$MNT"
          # Trixie puts the firmware partition here; older layouts used /boot.
          if [ -d "$MNT/boot/firmware" ]; then
            sudo mount "${loop}p1" "$MNT/boot/firmware"
          else
            sudo mount "${loop}p1" "$MNT/boot"
          fi
          for d in proc sys dev dev/pts run; do
            sudo mount --bind "/$d" "$MNT/$d"
          done
          df -h "$MNT"

      - name: Prepare the chroot
        run: |
          # Raspberry Pi OS preloads libarmmem, which is built for the Pi's
          # own memory layout and makes every command in the chroot fail on
          # any other machine. pi-gen does exactly this.
          if [ -f "$MNT/etc/ld.so.preload" ]; then
            sudo mv "$MNT/etc/ld.so.preload" "$MNT/etc/ld.so.preload.disabled"
          fi

          # Stop packages starting services inside the chroot.
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$MNT/usr/sbin/policy-rc.d" >/dev/null
          sudo chmod +x "$MNT/usr/sbin/policy-rc.d"

          # Platform detection reads /proc/device-tree/model, and /proc here is
          # the runner's, which has no device tree. Give it the fixture hook
          # that library/set_facts.yml already supports, so the image is built
          # as what it actually is: a Raspberry Pi.
          printf 'Raspberry Pi 5 Model B Rev 1.0\0' \
            | sudo tee "$MNT/etc/shackwright-pi-model" >/dev/null

      - name: Refresh the package index inside the image
        # The base image ships the apt lists it was built with. Debian moves
        # on: by the time the image is used, the exact versions those lists
        # name have been superseded and removed from the pool, and every
        # install 404s. The first build failed exactly this way, on
        # libxml2-dev, liblzma-dev and libxpm-dev.
        #
        # Updating the index is the minimum. Upgrading as well means the image
        # ships current packages rather than whatever was current on the day
        # the base image was cut, which for a security-relevant thing like an
        # SSH server matters.
        run: |
          sudo chroot "$MNT" apt-get update
          sudo chroot "$MNT" apt-get -y \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            dist-upgrade
          sudo chroot "$MNT" apt-get -y autoremove

      - name: Install Shackwright into the image
        id: install
        run: |
          mkdir -p ansible-output
          rc=0
          IFS=',' read -ra list <<< "${{ inputs.playbooks || env.DEFAULT_PLAYBOOKS }}"
          for name in "${list[@]}"; do
            name="$(echo "$name" | xargs)"
            [ -n "$name" ] || continue
            echo "::group::$name"
            started=$(date +%s)
            sudo -E "$(command -v ansible-playbook)" \
              -i "${MNT}," -c community.general.chroot \
              -e ham_user=pi \
              -e pi_model_path=/etc/shackwright-pi-model \
              -e ansible_python_interpreter=/usr/bin/python3 \
              library/set_facts.yml "tasks/${name}.yml" \
              2>&1 | tee "ansible-output/${name}.log"
            status=${PIPESTATUS[0]}
            echo $(( $(date +%s) - started )) > "ansible-output/${name}.seconds"
            [ "$status" -eq 0 ] || { echo "RESULT ${name}: FAIL"; rc=1; }
            [ "$status" -eq 0 ] && echo "RESULT ${name}: PASS"
            echo "::endgroup::"
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seed /etc/skel inside the image
        # Raspberry Pi OS ships no default account; the first-boot wizard
        # creates one and the operator picks the name. Without this, every
        # desktop entry, menu and config the build produced sits in an
        # orphaned /home/pi that the new account cannot see, and the image
        # looks broken for any operator who does not happen to choose "pi".
        run: |
          sudo -E "$(command -v ansible-playbook)" \
            -i "${MNT}," -c community.general.chroot \
            -e ham_user=pi \
            -e pi_model_path=/etc/shackwright-pi-model \
            -e ansible_python_interpreter=/usr/bin/python3 \
            -e shackwright_image_build=true \
            library/set_facts.yml tasks/install_user_skeleton.yml \
            2>&1 | tee ansible-output/install_user_skeleton.log
          exit ${PIPESTATUS[0]}

      - name: Remove the build scaffolding
        # policy-rc.d stops package maintainer scripts starting services
        # inside the chroot. It is a build-time device and the finalize step
        # already deletes it, so the shipped image never carried it -- but
        # finalize runs AFTER the manifest is taken, so build 9's manifest
        # listed /usr/sbin/policy-rc.d as if it were part of the image.
        #
        # A manifest that describes a state which never ships is the same
        # class of problem as every other one found today: plausible, and
        # wrong. Taking the scaffolding down before the inventory rather than
        # after it costs nothing and makes the manifest true.
        #
        # Safe here because no package installs happen after this point; the
        # only remaining steps read.
        run: |
          sudo rm -f "$MNT/usr/sbin/policy-rc.d"

      - name: Record what is in the image
        # Anyone who flashes a card is entitled to know what is on it. Until
        # now a release said only "untested image build N", which gives the
        # build number and nothing about the software.
        #
        # Read from the image itself rather than from the playbook list,
        # because those are different things: a playbook can report success
        # having skipped every task in it, which is exactly how ten playbooks
        # in this tree "install" dependencies that only exist on Buster. dpkg
        # is the authority on what actually landed.
        #
        # Runs before the unmount, since it needs the chroot. Native, not
        # emulated -- the runner is arm64 and so is the image.
        if: always()
        run: |
          pat='ham|fldigi|flrig|flamp|flmsg|flwrap|flnet|flaa|fllog'
          pat="${pat}|flcluster|flwkey|flxmlrpc|chirp|quisk|qdmr|voacap"
          pat="${pat}|pythonprop|soapy|rtl-sdr|librtlsdr|airspy|hackrf"
          pat="${pat}|bladerf|limesuite|uhd|gpredict|wsjt|js8|direwolf"
          pat="${pat}|ax25|gqrx|cubicsdr|trustedqsl|twclock|freedv|xastir"
          pat="${pat}|gridtracker|graywolf"

          # Everything in the executable directories that no package owns.
          #
          # The first version of this listed /usr/local/bin only, which missed
          # the software people actually came for: the w1hkj programs
          # ./configure --prefix=/usr, so fldigi, flarq and flnet install into
          # /usr/bin. Build 8's manifest therefore showed hamlib's rigctl and
          # nothing else, and a manifest that omits the flagship application
          # is worse than no manifest.
          #
          # Regular files only. update-alternatives fills these directories
          # with symlinks -- awk, cc, editor, java and about a hundred more --
          # which no package owns either, and including them buried the real
          # entries 4:1.
          local_bin=$(sudo chroot "$MNT" sh -c '
            cat /var/lib/dpkg/info/*.list 2>/dev/null \
              | grep -E "^/usr/(bin|sbin|local/bin|local/sbin)/" \
              | sort -u > /tmp/.owned
            find /usr/bin /usr/sbin /usr/local/bin /usr/local/sbin \
              -maxdepth 1 -type f 2>/dev/null | sort -u > /tmp/.present
            comm -23 /tmp/.present /tmp/.owned
            rm -f /tmp/.owned /tmp/.present
          ' || true)
          radio=$(sudo chroot "$MNT" \
            dpkg-query -W -f='${Package}\t${Version}\n' 2>/dev/null \
            | grep -iE "$pat" | sort || true)

          {
            echo "Shackwright image contents"
            echo "Built $(date -u +%Y-%m-%dT%H:%M:%SZ) from ${GITHUB_SHA}"
            echo "Build ${GITHUB_RUN_NUMBER}"
            echo
            echo "== Base =="
            sudo chroot "$MNT" grep -E '^(PRETTY_NAME|VERSION)=' \
              /etc/os-release 2>/dev/null | sed 's/^/  /' || echo "  unknown"
            echo "  kernels: $(sudo chroot "$MNT" sh -c \
              'ls -1 /lib/modules 2>/dev/null | tr "\n" " "')"
            echo
            echo "== Amateur radio packages from Debian =="
            # Captured first rather than piped straight through. "|| echo"
            # on a pipeline tests the LAST command, which is sed and always
            # succeeds, so a grep that matched nothing printed an empty
            # section and no warning -- an empty result that reads as a
            # result. That mistake has cost enough time today.
            if [ -n "$radio" ]; then
              printf '%s\n' "$radio" | sed 's/^/  /'
            else
              echo "  NONE MATCHED -- either nothing was installed or the"
              echo "  pattern above needs updating. This is not a pass."
            fi
            echo
            echo "== Built from source, not managed by apt =="
            if [ -n "$local_bin" ]; then
              printf '%s\n' "$local_bin" | sed 's/^/  /'
              printf '  (%s executables)\n' \
                "$(printf '%s\n' "$local_bin" | wc -l)"
            else
              echo "  none"
            fi
            echo
            # Hamlib deliberately tracks its development branch, so "which
            # version" is a real question with a changing answer. Ask the
            # binaries rather than the playbooks. Timeout-guarded and
            # failure-tolerant: a program that will not answer --version is
            # not a reason to fail a build.
            echo "== Versions reported by source-built programs =="
            printed=0
            for prog in rigctl rotctl fldigi flarq flnet flrig; do
              v=$(sudo timeout 15 chroot "$MNT" sh -c \
                "command -v $prog >/dev/null 2>&1 && $prog --version 2>/dev/null | head -1" \
                2>/dev/null || true)
              if [ -n "$v" ]; then
                printf '  %-8s %s\n' "$prog" "$v"
                printed=1
              fi
            done
            [ "$printed" -eq 1 ] || echo "  none answered --version"

            echo
            echo "== Totals =="
            printf '  packages installed: %s\n' \
              "$(sudo chroot "$MNT" dpkg-query -f '.\n' -W 2>/dev/null | wc -l)"
          } | tee image-manifest.txt

          {
            echo "<details><summary>Image contents</summary>"
            echo
            echo '```'
            cat image-manifest.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Finalize and unmount
        if: always()
        run: |
          set -x
          # policy-rc.d is removed earlier, before the manifest is taken, so
          # the manifest reflects the shipped image. This is belt and braces
          # in case that step was skipped.
          sudo rm -f "$MNT/usr/sbin/policy-rc.d"
          if [ -f "$MNT/etc/ld.so.preload.disabled" ]; then
            sudo mv "$MNT/etc/ld.so.preload.disabled" "$MNT/etc/ld.so.preload"
          fi
          sudo rm -f "$MNT/etc/shackwright-pi-model"

          # Every flashed card must have its own SSH identity.
          sudo rm -f "$MNT"/etc/ssh/ssh_host_*
          sudo rm -rf "$MNT"/var/cache/apt/archives/*.deb
          sudo rm -rf "$MNT"/var/log/*.log "$MNT"/var/log/journal/* || true

          # The free space is NOT zeroed here. It used to be, and that was
          # wrong once the shrink existed: zeroing at 16 GiB, then compacting
          # the filesystem and growing it back by 512 MiB of slack, left that
          # slack full of relocated stale blocks. They compressed at about
          # 3.9:1 and added 139 MB to the download -- build 12 shipped LARGER
          # than build 11, which had no shrink at all. Zeroing now happens
          # after the shrink, where the free space is final.
          sudo sync

          for d in run dev/pts dev sys proc; do sudo umount -l "$MNT/$d" || true; done
          sudo umount "$MNT/boot/firmware" 2>/dev/null || sudo umount "$MNT/boot" || true
          sudo umount "$MNT" || true
          sudo losetup -d "${{ steps.mount.outputs.loop }}" || true

      - name: Shrink the image to its contents
        # The build grows the image to 16 GiB so there is room to compile in,
        # and almost none of that is used. Zeroing the free space makes it
        # compress well, but the partition is still full size, so the
        # compressed artifact came to 2.14 GB. GitHub caps one release asset
        # at 2 GiB, so it shipped as two files a downloader has to reassemble
        # by hand -- and Raspberry Pi Imager cannot read a split file, so the
        # one-click path the instructions advertise did not exist.
        #
        # Shrinking the root filesystem to its contents plus slack is what the
        # official Raspberry Pi images do. Raspberry Pi OS expands the root
        # partition to fill the card on first boot, so nothing is lost, and
        # the image becomes flashable to a smaller card.
        #
        # A note on parted, because this silently did nothing the first time
        # it was written: "parted -s ... resizepart" REFUSES to shrink. It
        # prints "Shrinking a partition can cause data loss, are you sure",
        # answers no on its own in script mode, and exits 0 having changed
        # nothing. The filesystem shrinks, the partition does not, the image
        # ships at full size, and no error appears anywhere. Deleting the
        # partition and recreating it at the same start sector does the job
        # without a prompt and leaves the filesystem exactly where it is.
        #
        # Verified on a miniature two-partition image before being written
        # here: 1 GiB down to 288 MB, fsck clean afterwards, and sha256 of the
        # contents identical across the shrink.
        run: |
          set -eux
          before=$(stat -c%s "$IMG")

          start=$(sudo parted -sm "$IMG" unit s print \
            | awk -F: '/^2:/{gsub(/s/,"",$2); print $2}')
          loop=$(sudo losetup --find --show -o $((start * 512)) "$IMG")

          sudo e2fsck -fy "$loop" || true
          sudo resize2fs -M "$loop"

          # Minimum plus slack, so a flashed card is not at 100% full before
          # the first-boot expansion runs.
          blk=$(sudo dumpe2fs -h "$loop" 2>/dev/null \
            | awk -F: '/Block size/{gsub(/ /,"",$2); print $2}')
          cnt=$(sudo dumpe2fs -h "$loop" 2>/dev/null \
            | awk -F: '/Block count/{gsub(/ /,"",$2); print $2}')
          sudo resize2fs "$loop" $(( cnt + (512 * 1024 * 1024 / blk) ))

          blk=$(sudo dumpe2fs -h "$loop" 2>/dev/null \
            | awk -F: '/Block size/{gsub(/ /,"",$2); print $2}')
          cnt=$(sudo dumpe2fs -h "$loop" 2>/dev/null \
            | awk -F: '/Block count/{gsub(/ /,"",$2); print $2}')
          sudo losetup -d "$loop"

          endsec=$(( start + (cnt * blk / 512) - 1 ))
          sudo parted -s "$IMG" rm 2
          sudo parted -s "$IMG" unit s mkpart primary ext4 "${start}s" "${endsec}s"
          truncate -s $(( (endsec + 1) * 512 )) "$IMG"

          # Never ship an image that will not survive a check. A smaller
          # broken image is worse than a large working one.
          loop=$(sudo losetup --find --show -o $((start * 512)) "$IMG")
          if sudo e2fsck -fn "$loop"; then
            sudo losetup -d "$loop"
          else
            sudo losetup -d "$loop"
            echo "fsck failed after the shrink; refusing to ship this image"
            exit 1
          fi

          # Zero the free space now, not before the shrink. What is left is
          # the 512 MiB of slack, and zeroes compress to almost nothing.
          mkdir -p shrinkmnt
          loop=$(sudo losetup --find --show -o $((start * 512)) "$IMG")
          sudo mount "$loop" shrinkmnt
          sudo dd if=/dev/zero of=shrinkmnt/zero.fill bs=4M status=none || true
          sudo rm -f shrinkmnt/zero.fill
          sudo sync
          sudo umount shrinkmnt
          sudo losetup -d "$loop"

          after=$(stat -c%s "$IMG")
          printf 'shrank %s -> %s bytes (%s%% smaller)\n' \
            "$before" "$after" "$(( 100 - after * 100 / before ))"

      - name: Boot the image under QEMU
        # The one check CI can make that resembles a real user's first five
        # minutes: does this thing actually come up?
        #
        # Every detail below was established by .github/workflows/
        # qemu-boot-probe.yml against the stock Raspberry Pi OS image, and
        # the first version of this step got three of them wrong at once,
        # producing a 71-byte console log that said nothing whatsoever.
        #
        #   * Capture BOTH serial ports. On QEMU's raspi3b the kernel talks
        #     on the second one; the first receives nothing at all. A single
        #     "-serial mon:stdio" records the wrong port and looks like a
        #     machine that never booted.
        #   * The console is ttyAMA1. Not ttyAMA0, and not ttyS0. On this
        #     machine model the PL011 registers as ttyAMA1 and the mini UART
        #     does not register at all:
        #
        #       3f201000.serial: ttyAMA1 at MMIO 0x3f201000 is a PL011 rev2
        #       bcm2835-aux-uart: unable to register 8250 port
        #       Warning: unable to open an initial console.
        #
        #     Naming either of the other two gives the kernel no /dev/console,
        #     so systemd starts without one and dies and the board resets. The
        #     probe did that forty times in six hundred seconds, and every one
        #     of those boots looked flawless in the log, because earlycon
        #     writes straight to MMIO and needs no tty.
        #   * Do NOT pass -initrd. Booting with the image's initramfs8
        #     panics with "Attempted to kill init!".
        #
        # Also bcm2710-rpi-3-b.dtb rather than the b-plus tree, to match the
        # machine QEMU is modelling, and systemd.firstboot=off, because a
        # first boot with nothing preset prompts on the console for locale
        # and a root password and no answer can arrive from a file.
        #
        # raspi3b, not raspi4b: Ubuntu 24.04 ships QEMU 8.2 and raspi4b
        # arrived in 9.0. QEMU's SD model also insists on a power-of-two
        # image, which the 16 GiB build satisfies.
        #
        # This does not exercise the Pi bootloader, VideoCore firmware, GPIO,
        # audio or any radio, and it does not replace putting the card in a
        # Pi. It catches the class of failure that makes an image useless to
        # everyone: a root filesystem that will not mount, a broken package
        # state, a system that never reaches userspace.
        #
        # Deliberately not a gate. It reports what it saw. Read the log.
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get install -y -qq qemu-system-arm
          loop=$(sudo losetup -Pf --show "$IMG")
          mkdir -p qemu boot-mnt
          sudo mount "${loop}p1" boot-mnt
          sudo cp boot-mnt/kernel8.img qemu/ 2>/dev/null || true
          sudo cp boot-mnt/bcm2710-rpi-3-b.dtb qemu/ 2>/dev/null || true
          sudo chown -R "$USER" qemu
          sudo umount boot-mnt
          sudo losetup -d "$loop"

          if [ ! -f qemu/kernel8.img ] || [ ! -f qemu/bcm2710-rpi-3-b.dtb ]; then
            echo "No 64-bit kernel or Pi 3 device tree in the boot partition."
            echo "Cannot boot here; this is not a verdict on the image."
            exit 0
          fi

          # QEMU's SD model insists on a power-of-two image, and the image
          # is no longer one now that it is shrunk to its contents. Pad a
          # sparse copy up to the next power of two rather than the original,
          # which costs no real disk and is also a more honest test: it is
          # exactly what a card looks like after a small image is flashed to
          # a larger one.
          sz=$(stat -c%s "$IMG")
          pot=1048576
          while [ "$pot" -lt "$sz" ]; do pot=$((pot * 2)); done
          cp --sparse=always "$IMG" qemu/sd.img
          truncate -s "$pot" qemu/sd.img
          echo "image ${sz} bytes, padded to ${pot} for QEMU"

          : > qemu/uart0.log
          : > qemu/uart1.log
          set +e
          timeout 900 qemu-system-aarch64 \
            -M raspi3b \
            -kernel qemu/kernel8.img \
            -dtb qemu/bcm2710-rpi-3-b.dtb \
            -drive file=qemu/sd.img,format=raw,if=sd \
            -append "rw rootwait earlycon loglevel=8 \
            console=ttyAMA1,115200 \
            root=/dev/mmcblk0p2 rootfstype=ext4 \
            systemd.firstboot=off systemd.unit=multi-user.target" \
            -serial file:qemu/uart0.log \
            -serial file:qemu/uart1.log \
            -display none > qemu/qemu.stdout 2>&1
          echo "qemu exited: $? (124 means it was still running at the limit)"
          set -e

          # The kernel talks on uart1 on this machine; keep both so a change
          # in that is visible rather than silently empty.
          cat qemu/uart0.log qemu/uart1.log > qemu/console.log

          echo "### bytes captured"
          for f in uart0 uart1 qemu.stdout; do
            printf '  %-12s %s\n' "$f" "$(stat -c%s "qemu/${f}.log" 2>/dev/null \
              || stat -c%s "qemu/${f}" 2>/dev/null || echo 0)"
          done

          echo "==================== BOOT CONSOLE (tail) ===================="
          tail -n 40 qemu/console.log || true
          echo "============================================================="
          echo "### Boot markers"
          # "systemd 257" rather than bare "systemd", which matches dozens of
          # unrelated kernel lines and tells you nothing.
          for marker in "Linux version" "VFS: Mounted root" "Run /sbin/init" \
                        "systemd\[1\]: systemd" "Reached target" "login:" \
                        "Kernel panic"; do
            n=$(grep -c "$marker" qemu/console.log 2>/dev/null || echo 0)
            printf '  %-22s %s\n' "$marker" "$n"
          done

          if grep -q "Kernel panic" qemu/console.log; then
            echo "VERDICT: panicked. This image did not boot."
          elif grep -q "Run /sbin/init" qemu/console.log; then
            echo "VERDICT: root filesystem mounted and init started."
          elif grep -q "Linux version" qemu/console.log; then
            echo "VERDICT: kernel started but never reached init."
          else
            echo "VERDICT: no kernel output. Treat as inconclusive, not as a failure."
          fi

      - name: Upload the boot console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-console
          path: |
            qemu/uart0.log
            qemu/uart1.log
            qemu/qemu.stdout
          retention-days: 14
          if-no-files-found: ignore

      - name: Package the image
        if: always()
        run: |
          [ -f "$IMG" ] || { echo "no image produced"; exit 1; }
          sudo chown "$USER" "$IMG"
          version="0.0.0-ci-${GITHUB_RUN_NUMBER}"
          packaging_utilities/package_release.sh "$IMG" "$version" release
          # Ship the manifest alongside the image so a downloader can see
          # what is in it without flashing a card first.
          [ -f image-manifest.txt ] && cp image-manifest.txt release/
          ls -lh release/

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Raspberry Pi image build"
            echo
            echo "| Playbook | Result | ok | changed | failed | Duration |"
            echo "|---|---|---|---|---|---|"
            for log in ansible-output/*.log; do
              [ -f "$log" ] || continue
              name=$(basename "$log" .log)
              recap=$(grep -oE 'ok=[0-9]+ +changed=[0-9]+ +unreachable=[0-9]+ +failed=[0-9]+' "$log" | tail -1)
              ok=$(echo "$recap" | grep -oE 'ok=[0-9]+' | cut -d= -f2)
              ch=$(echo "$recap" | grep -oE 'changed=[0-9]+' | cut -d= -f2)
              fa=$(echo "$recap" | grep -oE 'failed=[0-9]+' | cut -d= -f2)
              du=$(cat "ansible-output/${name}.seconds" 2>/dev/null || echo '?')
              if [ "${fa:-1}" = "0" ]; then v='pass'; else v='**FAIL**'; fi
              echo "| \`${name}\` | ${v} | ${ok:-?} | ${ch:-?} | ${fa:-?} | ${du}s |"
            done
            echo
            echo "### Artifacts"
            echo '```'
            ls -lh release/ 2>/dev/null || echo 'none produced'
            echo '```'
            echo
            echo "_Built by chroot on an arm64 runner. Not yet booted on hardware._"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shackwright-image
          path: release/
          retention-days: 7

      - name: Publish the image as a prerelease
        # Releases, not git. The image is one to two gigabytes; GitHub rejects
        # files over 100 MB in git, and even through LFS it would sit in the
        # repository forever and be paid for on every clone. A release asset
        # is the right home, and package_release.sh has already split the
        # image into parts under the 2 GiB per-asset limit.
        #
        # Marked prerelease, and named so, because nothing here has been
        # booted. It is a build artifact people can flash and try, not a
        # release anyone should be told is finished.
        if: steps.install.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="image-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --title "Untested image build ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "$(cat <<'NOTES'
          Automated image build. **Not booted on hardware. Not a release.**

          Built by chroot on a native arm64 runner from the official
          Raspberry Pi OS Trixie arm64 image, with the package index
          refreshed and the system dist-upgraded first.

          Verify and flash per the RELEASE.md asset included here. If the
          image is split into parts, reassemble them before flashing.

          If you boot this, please report what happens — that is the one
          thing continuous integration cannot establish.
          NOTES
          )" \
            release/* || {
              echo "Release publish failed; the image is still available as a workflow artifact."
              exit 0
            }
          echo "Published $tag"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-logs
          path: ansible-output/
          retention-days: 14

      - name: Report failures and fail the job
        # Printed here, as the last step, deliberately. Earlier revisions put
        # this in the Summarize step, which sits above the artifact uploads --
        # far enough up a long log that the reason a build failed could not be
        # read back without downloading the artifact. Last step means the tail
        # of the log is the diagnosis.
        if: always()
        run: |
          rc=0
          for log in ansible-output/*.log; do
            [ -f "$log" ] || continue
            name=$(basename "$log" .log)
            f=$(grep -oE 'failed=[0-9]+' "$log" | tail -1 | cut -d= -f2)
            if [ "${f:-1}" != "0" ]; then
              rc=1
              echo "=============================================================="
              echo "FAILED: ${name}"
              echo "=============================================================="
              # The last TASK banner before the failure, then the tail, which
              # carries the error and the recap whatever wording Ansible used.
              awk '/failed=[1-9]/{exit} /^TASK \[/{t=$0} END{print "Last task started: " t}' "$log"
              echo "--------------------------------------------------------------"
              tail -n 40 "$log"
              echo
            else
              echo "OK: ${name}"
            fi
          done
          exit "$rc"
