- name: Install flpost
  hosts: all
  gather_facts: no
  tasks:

  # flpost has no source left to build.
  #
  # This playbook downloaded from http://www.w1hkj.com/alpha/flpost/, which
  # answers 404. Unlike the rest of the w1hkj suite it is not on SourceForge
  # either -- the fldigi project's file listing has directories for flaa,
  # flamp, flcluster, fldigi, fllog, flmsg, flnet, flrig, flwkey, flwrap and
  # flxmlrpc, and no flpost. It was distributed from an "alpha" directory
  # rather than "files", so it was never a release to begin with. Debian does
  # not package it.
  #
  # There is nothing to point this at. Rather than leave a playbook that can
  # only fail, or quietly drop a program someone may be looking for, it says
  # so and moves on. The import stays in tasks/main.yml so the message is
  # seen by anyone who expected flpost to be here.
  - name: Report that flpost is no longer available
    ansible.builtin.debug:
      msg: >-
        flpost is not installed: its upstream download
        (w1hkj.com/alpha/flpost) returns 404, it is absent from the fldigi
        project's SourceForge file listing, and Debian does not package it.
        If you know of a current source, it belongs in this file.
