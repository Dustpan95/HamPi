---
# file: group_vars/all
# this is the playbook wide default

#
# PEP 668 / externally managed environments
#
# Debian 12 and later, and Ubuntu 23.04 and later, mark the system Python as
# "externally managed": pip refuses to install into it so that pip and apt
# cannot fight over the same files. Several HamPi applications are Python
# programs that need to be importable system-wide and launched from the
# desktop menu, so they are installed into the system interpreter with the
# override below.
#
# This is a deliberate trade-off, not an oversight. The override is centralized
# here so there is one place to change it, rather than the sixteen scattered
# copies of --break-system-packages this replaced.
#
# The cleaner long-term fix is a dedicated virtual environment for the Python
# applications, with the desktop launchers pointing at it. That changes where
# every one of these programs lives, so it needs testing on real hardware
# before it ships. See the "Known issues" section of README.md.
#
# On an older release that predates PEP 668 the flag does not exist and pip
# would reject it, so it resolves to an empty string there. The pip module
# tests extra_args for truthiness, so an empty value adds nothing to the
# command line.
pip_system_extra_args: "{{ '--break-system-packages' if (is_bookworm | bool or is_trixie | bool or is_forky | bool) else '' }}"

#
# Parallel compilation
#
# 79 playbooks compiled with -j <core count>, which is -j4 on every Raspberry
# Pi regardless of how much memory it has. A heavy C++ link -- wxWidgets, Qt,
# SDRAngel -- can hold 1-2 GB in a single compiler process, so four at once on
# a 2 GB board invokes the OOM killer part way through a multi-hour build, and
# Raspberry Pi OS ships only about 200 MB of swap to absorb it.
#
# Cap the job count by memory as well as cores: roughly one job per 1.5 GB,
# never more than the core count, never fewer than one. A 2 GB Pi builds
# serially and slowly, which is far better than failing at hour two.
#
# shackwright_make_jobs is set in library/set_facts.yml, not here. This file is
# only loaded by init_task.yml, so a value defined here is undefined for any
# playbook run on its own. Override it with -e if you need to.

# Enlarge swap for the build on boards with less memory than this. Anything at
# or above it has enough headroom that the default swap is fine.
swap_ram_threshold_mb: 8192

# Swap size to use while building, in MB. Restored to the original after the
# run by finish_tasks.yml, so this does not persist into a released image.
build_swap_size_mb: 4096

