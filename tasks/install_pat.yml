- name: Install Pat (WinLink)
  hosts: all
  tasks:

  - name: Create directory hamradio
    file:
      path: /home/{{ ham_user }}/hamradio/
      state: directory

  - name: Install Patmenu2 dependencies
    become: yes
    package:
      name: "{{ item }}"
      state: present
    with_items:
      - ruby
      - yad
      - jq
    retries: 5
    delay: 30
    register: result
    until: result.failed == false

  - name: Install Patmenu2 Ruby gems
    become: yes
    command: gem install gpsd_client maidenhead

  - name: Git clone latest Patmenu2
    git:
      repo: 'https://github.com/km4ack/patmenu2.git'
      dest: /home/{{ ham_user }}/patmenu2
    retries: 5
    delay: 30
    register: result
    until: result.failed == false

  - name: Make Patmenu2 setup executable
    become: yes
    file:
      path: /home/{{ ham_user }}/patmenu2/setup
      mode: a+x

  - name: Create directory /usr/local/share/applications
    become: yes
    file:
      path: /usr/local/share/applications
      state: directory

  - name: Modify path for {{ ham_user }} patmenu2.desktop
    become: yes
    replace:
      path: /home/{{ ham_user }}/patmenu2/patmenu2.desktop
      regexp: "\/home\/pi\/"
      replace: "/home/{{ ham_user }}/"
    when: is_pc|bool

  - name: Modify path for {{ ham_user }} 891.km4ack.config
    become: yes
    replace:
      path: /home/{{ ham_user }}/patmenu2/891.km4ack.config
      regexp: "\/home\/pi\/"
      replace: "/home/{{ ham_user }}/"
    when: is_pc|bool

  - name: Copy Patmenu2.desktop to /usr/local/share/applications
    become: yes
    shell: cp -a /home/{{ ham_user }}/patmenu2/patmenu2.desktop /usr/local/share/applications/patmenu2.desktop

  - name: Modify categories for patmenu2.desktop
    become: yes
    lineinfile:
      path: /usr/local/share/applications/patmenu2.desktop
      regexp: '^Categories=.*'
      line: Categories=HamRadio

# Pat itself.
#
# All three architecture blocks that used to live here found their version by
# curling https://github.com/la5nta/pat/releases/ and running grep over the
# rendered HTML. That returns nothing now, so the download URL became
# ".../download/v/pat__linux_armhf.deb" and 404'd. Same defect as the fldigi
# suite, same fix: ask for the version through an interface that is meant to
# be parsed, and refuse to build a URL out of whatever comes back until it
# has been checked.
#
# There was a second bug underneath the first, and it would have outlived it.
# The ARM branch was guarded on is_arm alone and downloaded
# pat_<ver>_linux_armhf.deb -- the 32-bit build -- on every Pi. Raspberry Pi
# OS has been 64-bit by default for years; an armhf .deb does not install on
# an arm64 system without multiarch. Upstream publishes an arm64 build and
# this tree never asked for it. That is the same family as the is_arm_64 bug
# already fixed in library/set_facts.yml, where is_arm_64 was true for 32-bit
# userlands and made every 64-bit branch unreachable.
#
# Four near-identical blocks collapse into one, selected by architecture.
#
# Upstream rather than Debian, and deliberately: Debian trixie ships pat
# 0.16.0 and upstream is at 1.0.0. A whole major version is too much to give
# up on the WinLink client, and upstream ships proper signed .debs for every
# architecture, so there is no source build to go wrong.

  - name: Select the Pat package architecture
    ansible.builtin.set_fact:
      pat_arch: >-
        {{ 'arm64' if (is_arm | bool and is_arm_64 | bool)
           else 'armhf' if (is_arm | bool)
           else 'amd64' if (is_x86_64 | bool)
           else 'i386' if (is_i386 | bool)
           else '' }}

  - name: Refuse to guess at an architecture for Pat
    ansible.builtin.assert:
      that:
        - pat_arch | length > 0
      fail_msg: >-
        No Pat package is published for this architecture. Detected
        is_arm={{ is_arm }} is_arm_64={{ is_arm_64 }}
        is_x86_64={{ is_x86_64 }} is_i386={{ is_i386 }}.

  - name: Determine the latest Pat release
    # The releases API, not the releases page. The page is rendered HTML that
    # changes shape whenever GitHub redesigns it, which is what broke this.
    ansible.builtin.shell:
      cmd: >-
        curl -fsSL https://api.github.com/repos/la5nta/pat/releases/latest
        | grep -Po '"tag_name"\s*:\s*"v?\K[^"]+'
      executable: /bin/bash
    register: pat_lookup
    changed_when: false
    failed_when: false
    retries: 3
    delay: 15
    until: pat_lookup.rc == 0

  - name: Refuse to continue without a real Pat version
    ansible.builtin.assert:
      that:
        - pat_lookup.stdout | trim is match('^[0-9]+(\.[0-9]+)+$')
      fail_msg: >-
        Could not determine a Pat version from the GitHub releases API. Got
        '{{ pat_lookup.stdout | trim }}'. Stopping rather than interpolating
        that into a download URL, which is what the previous version of this
        playbook did.
      success_msg: "Pat {{ pat_lookup.stdout | trim }} ({{ pat_arch }})"

  - name: Record the Pat version
    ansible.builtin.set_fact:
      pat_version: "{{ pat_lookup.stdout | trim }}"

  - name: Download Pat {{ pat_version }} for {{ pat_arch }}
    ansible.builtin.get_url:
      url: >-
        https://github.com/la5nta/pat/releases/download/v{{ pat_version
        }}/pat_{{ pat_version }}_linux_{{ pat_arch }}.deb
      dest: "/home/{{ ham_user }}/hamradio/pat_{{ pat_version }}_{{ pat_arch }}.deb"
      mode: '0644'
    retries: 5
    delay: 30
    register: result
    until: result.failed == false

  - name: Install Pat {{ pat_version }}
    become: yes
    ansible.builtin.apt:
      deb: "/home/{{ ham_user }}/hamradio/pat_{{ pat_version }}_{{ pat_arch }}.deb"

  - name: Remove the Pat installer
    ansible.builtin.file:
      path: "/home/{{ ham_user }}/hamradio/pat_{{ pat_version }}_{{ pat_arch }}.deb"
      state: absent

  # John Wiseman publishes a separate build per architecture, and this task
  # asked for the 32-bit one unconditionally. On a 64-bit image that installs
  # an "ELF 32-bit LSB executable, ARM, EABI5" whose interpreter is
  # /lib/ld-linux-armhf.so.3 -- which arm64 Raspberry Pi OS does not have, so
  # the program cannot start at all. It shipped that way; the emulated boot
  # check is what found it. piardopc64 at the same location is the aarch64
  # build. The destination name stays piardopc either way, because that is
  # what Pat's configuration invokes.
  - name: Download Pi Ardop for {{ 'aarch64' if (is_arm_64 | bool) else 'armhf' }}
    become: yes
    ansible.builtin.get_url:
      url: >-
        https://www.cantab.net/users/john.wiseman/Downloads/Beta/{{
        'piardopc64' if (is_arm_64 | bool) else 'piardopc' }}
      dest: /usr/local/bin/piardopc
      mode: a+x
    when: is_arm | bool
    retries: 5
    delay: 30
    register: result
    until: result.failed == false
