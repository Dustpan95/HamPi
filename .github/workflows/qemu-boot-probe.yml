---
name: QEMU boot probe

# A control experiment, not part of the build.
#
# The first boot test in build-image.yml produced a 71-byte console log
# containing nothing but QEMU's own "terminating on signal 15" message. QEMU
# ran for the full 900 second timeout without erroring, so it loaded
# something and executed it -- but not one line of kernel output reached the
# file. That result says nothing about whether the image boots. It only says
# the harness is not wired correctly, or the guest hangs before the first
# printk.
#
# So: boot the STOCK Raspberry Pi OS image, untouched by us, under several
# configurations at once. If stock produces no output either, the fault is in
# the harness and the built image is not implicated. Whichever configuration
# does produce a kernel banner is the one build-image.yml should use.
#
# Both UARTs are captured every time. On a Pi 3 the PL011 (ttyAMA0) is
# claimed by Bluetooth and the mini UART (ttyS0) carries the console; which
# of the two QEMU wires to which -serial is exactly the sort of detail worth
# not guessing about. Writing both to files and passing both on the kernel
# command line removes the question.

on:
  push:
    branches: [BetaTesting]
    paths: ['.github/workflows/qemu-boot-probe.yml']
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds to let each configuration run'
        required: false
        default: '600'

permissions:
  contents: read

jobs:
  probe:
    name: Probe QEMU boot configurations
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and report its version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-utils file xxd
          qemu-system-aarch64 --version
          echo "### Machines matching raspi"
          qemu-system-aarch64 -M help | grep -i raspi || echo "  none"

      - name: Download the stock Raspberry Pi OS image
        run: |
          curl -fL --retry 3 -o base.img.xz \
            https://downloads.raspberrypi.com/raspios_lite_arm64_latest
          xz -d --stdout base.img.xz > stock.img
          rm -f base.img.xz
          ls -lh stock.img
          # QEMU's SD card model requires a power-of-two size. The stock image
          # is not one, so pad it. Padding does not touch the partitions.
          truncate -s 4G stock.img
          ls -l stock.img

      - name: Extract the kernels and device trees
        run: |
          mkdir -p fw
          loop=$(sudo losetup -Pf --show stock.img)
          mkdir -p boot-mnt
          sudo mount "${loop}p1" boot-mnt
          echo "### Boot partition contents"
          ls -la boot-mnt/
          echo "### cmdline.txt"
          cat boot-mnt/cmdline.txt || true
          echo "### config.txt"
          cat boot-mnt/config.txt || true
          sudo cp boot-mnt/*.img fw/ 2>/dev/null || true
          sudo cp boot-mnt/*.dtb fw/ 2>/dev/null || true
          sudo cp boot-mnt/initramfs* fw/ 2>/dev/null || true
          sudo chown -R "$USER" fw
          sudo umount boot-mnt
          sudo losetup -d "$loop"
          echo "### Collected"
          ls -la fw/
          echo "### What are the kernels?"
          for k in fw/*.img; do
            printf '%-28s %s\n' "$(basename "$k")" "$(file -b "$k")"
          done
          echo "### arm64 Image magic (expect 'ARM' + 0x64 at offset 0x38)"
          for k in fw/kernel8.img fw/kernel_2712.img; do
            [ -f "$k" ] || continue
            printf '%-28s ' "$(basename "$k")"
            xxd -s 0x38 -l 4 "$k" || true
          done
          echo "### Root partition"
          sudo fdisk -l stock.img || true

      - name: Boot the stock image under each configuration
        env:
          SECS: ${{ inputs.seconds || '600' }}
        run: |
          mkdir -p probe

          # Both UARTs are captured every time, so a configuration that looks
          # dead is dead rather than merely unrecorded.
          #
          # The console name, established the hard way over three rounds.
          #
          # Neither of the obvious names works on QEMU's raspi3b with a
          # current Raspberry Pi OS kernel. The log from round three says so
          # directly:
          #
          #   3f201000.serial: ttyAMA1 at MMIO 0x3f201000 ... is a PL011 rev2
          #   bcm2835-aux-uart 3f215040.serial: unable to register 8250 port
          #   bcm2835-aux-uart 3f215040.serial: probe ... failed with error -22
          #   Warning: unable to open an initial console.
          #
          # The PL011 comes up as ttyAMA1, not ttyAMA0, and the mini UART --
          # ttyS0 -- does not register at all under this machine model. So
          # console=ttyS0 and console=ttyAMA0 both name devices that do not
          # exist, the kernel cannot open /dev/console, systemd starts
          # without one and dies, and the machine resets. Round three did
          # that forty times in six hundred seconds.
          #
          # None of it was visible in the kernel log because earlycon writes
          # straight to the aux UART's MMIO registers without needing a tty.
          # Every boot looked flawless right up to the reset: root mounted,
          # /sbin/init ran, systemd announced itself. That is three separate
          # occasions in this one afternoon where output arriving somewhere
          # unexpected looked exactly like a component working or failing.
          #
          # earlycon is kept so the early kernel messages still arrive on the
          # aux UART, which is QEMU's second -serial. Once ttyAMA1 takes over
          # the rest lands on the first. Both are captured, as always.
          common_append="rw rootwait earlycon loglevel=8 console=ttyAMA1,115200"

          run_config() {
            name="$1"; shift
            echo "=================================================="
            echo "### ${name}"
            echo "=================================================="
            rm -f "probe/${name}.uart0" "probe/${name}.uart1"
            : > "probe/${name}.uart0"
            : > "probe/${name}.uart1"
            set +e
            timeout "$SECS" qemu-system-aarch64 \
              -serial "file:probe/${name}.uart0" \
              -serial "file:probe/${name}.uart1" \
              -display none \
              "$@" > "probe/${name}.stdout" 2>&1
            rc=$?
            set -e
            echo "exit ${rc} (124 = hit the time limit, still running)"
            for u in uart0 uart1 stdout; do
              sz=$(stat -c%s "probe/${name}.${u}" 2>/dev/null || echo 0)
              printf '  %-8s %8s bytes\n' "$u" "$sz"
            done
            for u in uart0 uart1; do
              sz=$(stat -c%s "probe/${name}.${u}" 2>/dev/null || echo 0)
              if [ "$sz" -gt 0 ]; then
                echo "  --- ${u} first 25 lines ---"
                head -n 25 "probe/${name}.${u}" | sed 's/^/  | /'
                echo "  --- ${u} last 25 lines ---"
                tail -n 25 "probe/${name}.${u}" | sed 's/^/  | /'
              fi
            done
            if [ -s "probe/${name}.stdout" ]; then
              echo "  --- qemu stdout/stderr ---"
              sed 's/^/  | /' "probe/${name}.stdout"
            fi
          }

          # What the earlier rounds settled, so they are not repeated here:
          #
          #   * raspi3b with bcm2710-rpi-3-b.dtb mounts ext4 from mmcblk0p2
          #     and runs /sbin/init. The machine model and the image are fine.
          #   * the kernel talks on QEMU's SECOND -serial, because earlycon
          #     binds the aux UART. A harness passing a single -serial records
          #     the wrong port and sees nothing at all.
          #   * do not pass -initrd initramfs8; that panics with "Attempted to
          #     kill init!".
          #   * systemd.firstboot=off is required, or a first boot with
          #     nothing preset waits forever for a locale and a root password
          #     that nobody can type into a file.

          # Round four. If naming a console that exists is the whole of it,
          # this reaches a login prompt. If it does not, the reset has
          # another cause and the log will now be able to say what, because
          # systemd finally has somewhere to write.
          run_config ttyama1 \
            -M raspi3b -kernel fw/kernel8.img -dtb fw/bcm2710-rpi-3-b.dtb \
            -drive file=stock.img,format=raw,if=sd \
            -append "${common_append} root=/dev/mmcblk0p2 \
            systemd.firstboot=off systemd.unit=multi-user.target"

          echo
          echo "=================================================="
          echo "### Summary: bytes of console output per configuration"
          echo "=================================================="
          printf '%-22s %10s %10s  %s\n' CONFIG UART0 UART1 VERDICT
          for f in probe/*.uart0; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .uart0)
            a=$(stat -c%s "probe/${n}.uart0" 2>/dev/null || echo 0)
            b=$(stat -c%s "probe/${n}.uart1" 2>/dev/null || echo 0)
            if grep -qs "Linux version" "probe/${n}.uart0" \
               "probe/${n}.uart1"; then
              v="KERNEL STARTED"
              if grep -qs -e "login:" -e "Reached target" \
                 "probe/${n}.uart0" "probe/${n}.uart1"; then
                v="BOOTED TO USERSPACE"
              fi
            elif [ "$a" -gt 0 ] || [ "$b" -gt 0 ]; then
              v="output, but no kernel banner"
            else
              v="silent"
            fi
            printf '%-22s %10s %10s  %s\n' "$n" "$a" "$b" "$v"
          done

      - name: Upload every console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-probe-consoles
          path: probe/
          retention-days: 14
