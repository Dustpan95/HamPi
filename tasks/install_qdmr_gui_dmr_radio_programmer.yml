- name: Install QDMR - GUI application and command line tool to program DMR radios
  hosts: all
  tasks:

  # This was a source build: clone hmatuschek/qdmr, run cmake, make, make
  # install. It failed on the trial runner because nothing in it installs
  # cmake -- the build depended on install_cmake.yml having run first, so
  # the playbook could not be run on its own or as part of a subset, which
  # is exactly how the image build runs playbooks.
  #
  # Fixing that by adding cmake to the dependency list would have left the
  # rest: eleven Qt5 -dev packages, a full C++ build of a Qt application on
  # a Raspberry Pi, and a checkout of the master branch, which is whatever
  # upstream pushed most recently rather than a release anyone tested.
  #
  # Debian packages qdmr 0.12.1, built against the Qt the release actually
  # ships, with the udev rules included. The udevadm reload the source build
  # needed is handled by the package's own trigger.
  - name: Install QDMR
    become: yes
    ansible.builtin.package:
      name: qdmr
      state: present
    retries: 5
    delay: 30
    register: result
    until: result.failed == false

  - name: Check for the QDMR desktop entry
    ansible.builtin.stat:
      path: /usr/share/applications/qdmr.desktop
    register: qdmr_desktop

  # File it under HamRadio in the menu. Guarded on the file existing, because
  # a desktop entry's path is the package's business and not something to
  # fail an install over if a future release moves it.
  - name: Modify categories for qdmr.desktop
    become: yes
    ansible.builtin.lineinfile:
      path: /usr/share/applications/qdmr.desktop
      regexp: '^Categories=.*'
      line: Categories=HamRadio
    when: qdmr_desktop.stat.exists
