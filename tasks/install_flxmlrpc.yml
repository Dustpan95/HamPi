- name: Install flxmlrpc
  hosts: all
  gather_facts: no
  tasks:

  # flxmlrpc is the XML-RPC library the rest of the w1hkj suite links
  # against, not an application anyone runs. It was built from source here,
  # scraping w1hkj.com for its version -- a host that no longer serves the
  # directory -- and then running ldconfig to make the freshly built shared
  # library findable.
  #
  # Debian packages it as libflxmlrpc-dev, which brings the runtime library
  # with it and needs no ldconfig, because dpkg's trigger does that. The
  # playbooks that link against it list it as a dependency directly, so this
  # is mostly here to keep the import in tasks/main.yml meaningful and to
  # cover anyone running it on its own.
  - name: Install the flxmlrpc library and headers
    become: yes
    ansible.builtin.package:
      name: libflxmlrpc-dev
      state: present
    retries: 5
    delay: 30
    register: result
    until: result.failed == false
