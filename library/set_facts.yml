#
# Platform detection for HamPi / HamPC / HamIQ.
#
# Design notes for maintainers:
#
#   * Every fact is given a default in the first task. Ansible has no
#     "undefined is false" semantics, so a `when: is_trixie|bool` against an
#     undefined variable is a hard failure. Defining the full set up front
#     means a task may test any platform fact without guarding it.
#
#   * Distribution detection uses ansible_distribution_release rather than
#     ansible_lsb. ansible_lsb is only populated when the lsb_release package
#     is installed, which is not the case on a minimal Raspberry Pi OS or
#     Debian install, and an undefined ansible_lsb.id used to abort the run
#     before a single application was built.
#
#   * Hardware detection reads /proc/device-tree/model rather than inferring
#     "this must be a Pi" from the distribution ID. Raspberry Pi OS reports
#     itself as Debian on 64-bit, so the old ansible_lsb.id == "Debian" test
#     also matched any generic Debian PC.
#
#   * Word size is taken from ansible_userspace_bits, not from the kernel
#     architecture. A 64-bit kernel running a 32-bit userland (a supported and
#     common Raspberry Pi OS configuration) reports ansible_architecture ==
#     aarch64 while still needing armhf binaries. Anything that downloads a
#     prebuilt .deb must branch on the userland, not the kernel.
#

---

- name: Set HamPi / HamPC / HamIQ facts
  hosts: all
  gather_facts: true
  tasks:

    - name: Initialize all platform facts to a known state
      ansible.builtin.set_fact:
        # Product
        is_hampi: false
        is_hampc: false
        is_hamiq: false
        # Hardware class
        is_rpi: false
        is_pc: false
        is_iq: false
        # CPU
        is_arm: false
        is_arm_64: false
        is_i386: false
        is_x86_64: false
        # OS family
        is_debian: false
        is_ubuntu: false
        # Debian releases
        is_buster: false
        is_bullseye: false
        is_bookworm: false
        is_trixie: false
        is_forky: false
        # Ubuntu releases
        is_impish: false
        is_jammy: false
        is_noble: false
        is_resolute: false
        # Raspberry Pi hardware
        pi_model: ""
        is_pi_zero: false
        is_pi4: false
        is_pi5: false

    - name: Detect Raspberry Pi hardware model
      ansible.builtin.slurp:
        # Overridable so the detection logic can be exercised in CI on a
        # non-Pi host by pointing at a fixture file.
        src: "{{ pi_model_path | default('/proc/device-tree/model') }}"
      register: hampi_model_raw
      failed_when: false
      changed_when: false

    - name: Set Raspberry Pi hardware model fact
      ansible.builtin.set_fact:
        # /proc/device-tree/model is a NUL-terminated device tree string.
        pi_model: >-
          {{ (hampi_model_raw.content | b64decode | regex_replace('\x00', '') | trim)
             if (hampi_model_raw.content is defined) else '' }}

    - name: Set facts for 32-bit ARM CPU
      ansible.builtin.set_fact:
        is_arm: true
        is_arm_64: false
      when: ansible_architecture in ['armv6l', 'armv7l', 'armhf', 'arm']

    - name: Set facts for 64-bit ARM CPU
      ansible.builtin.set_fact:
        is_arm: true
        # A 64-bit kernel with a 32-bit userland still needs armhf binaries.
        is_arm_64: "{{ ansible_userspace_bits | default('64') == '64' }}"
      when: ansible_architecture in ['aarch64', 'arm64']

    - name: Set facts for 32-bit x86 CPU
      ansible.builtin.set_fact:
        is_i386: true
      when: ansible_architecture in ['i386', 'i686']

    - name: Set facts for 64-bit x86 CPU
      ansible.builtin.set_fact:
        is_x86_64: true
      when: ansible_architecture in ['x86_64', 'amd64']

    - name: Set facts for Debian and Raspberry Pi OS
      ansible.builtin.set_fact:
        is_debian: true
      when: ansible_distribution in ['Debian', 'Raspbian']

    - name: Set facts for Ubuntu / Xubuntu
      ansible.builtin.set_fact:
        is_ubuntu: true
      when: ansible_distribution == 'Ubuntu'

    - name: Set facts for Debian 10 Buster
      ansible.builtin.set_fact:
        is_buster: true
      when: is_debian | bool and ansible_distribution_release == 'buster'

    - name: Set facts for Debian 11 Bullseye
      ansible.builtin.set_fact:
        is_bullseye: true
      when: is_debian | bool and ansible_distribution_release == 'bullseye'

    - name: Set facts for Debian 12 Bookworm
      ansible.builtin.set_fact:
        is_bookworm: true
      when: is_debian | bool and ansible_distribution_release == 'bookworm'

    - name: Set facts for Debian 13 Trixie
      ansible.builtin.set_fact:
        is_trixie: true
      when: is_debian | bool and ansible_distribution_release == 'trixie'

    - name: Set facts for Debian 14 Forky
      ansible.builtin.set_fact:
        is_forky: true
      when: is_debian | bool and ansible_distribution_release == 'forky'

    #
    # Ubuntu releases additionally assert the Debian release they were forked
    # from. Task files predating this rewrite branch on the Debian codename
    # alone, so an Ubuntu host must answer to it or it takes no branch at all.
    #
    - name: Set facts for Ubuntu 21.10 Impish
      ansible.builtin.set_fact:
        is_impish: true
        is_bullseye: true
      when: is_ubuntu | bool and ansible_distribution_release == 'impish'

    - name: Set facts for Ubuntu 22.04 Jammy
      ansible.builtin.set_fact:
        is_jammy: true
        is_bullseye: true
      when: is_ubuntu | bool and ansible_distribution_release == 'jammy'

    - name: Set facts for Ubuntu 24.04 Noble
      ansible.builtin.set_fact:
        is_noble: true
        is_bookworm: true
      when: is_ubuntu | bool and ansible_distribution_release == 'noble'

    - name: Set facts for Ubuntu 26.04 Resolute
      ansible.builtin.set_fact:
        is_resolute: true
        is_trixie: true
      when: is_ubuntu | bool and ansible_distribution_release == 'resolute'

    - name: Set facts for Raspberry Pi hardware
      ansible.builtin.set_fact:
        is_rpi: true
        is_hampi: true
      when: pi_model is search('Raspberry Pi')

    - name: Set facts for specific Raspberry Pi models
      ansible.builtin.set_fact:
        is_pi_zero: "{{ pi_model is search('Raspberry Pi Zero') }}"
        is_pi4: "{{ pi_model is search('Raspberry Pi 4') or pi_model is search('Raspberry Pi 400') }}"
        is_pi5: "{{ pi_model is search('Raspberry Pi 5') or pi_model is search('Raspberry Pi 500') }}"
      when: is_rpi | bool

    - name: Set facts for Inovato Quadra
      ansible.builtin.set_fact:
        is_iq: true
        is_hamiq: true
      when: not is_rpi | bool and inventory_hostname == 'inovato'

    - name: Set facts for PC
      ansible.builtin.set_fact:
        is_pc: true
        is_hampc: true
      when: not is_rpi | bool and not is_iq | bool

    - name: Report detected platform
      ansible.builtin.debug:
        msg: >-
          Detected {{ ansible_distribution }} {{ ansible_distribution_version }}
          ({{ ansible_distribution_release }}) on {{ ansible_architecture }}
          with a {{ ansible_userspace_bits | default('unknown') }}-bit userland
          {{ '- ' ~ pi_model if pi_model | length > 0 else '' }}

    - name: Confirm exactly one CPU architecture matched
      ansible.builtin.assert:
        that:
          - (is_arm | bool) or (is_i386 | bool) or (is_x86_64 | bool)
          - not (is_arm | bool and is_x86_64 | bool)
        fail_msg: >-
          Unable to determine CPU architecture from
          ansible_architecture={{ ansible_architecture }}.

    - name: Confirm the operating system is supported
      ansible.builtin.assert:
        that:
          - (is_debian | bool) or (is_ubuntu | bool)
        fail_msg: >-
          HamPi supports Debian, Raspberry Pi OS and Ubuntu.
          Detected {{ ansible_distribution }}.

    - name: Warn when running an end-of-life operating system
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ ansible_distribution_release }} is end-of-life and no
          longer receives security updates. HamPi targets Debian 13 (Trixie).
          Builds on this release are unsupported and are expected to fail.
      when: is_buster | bool or is_bullseye | bool or is_impish | bool
