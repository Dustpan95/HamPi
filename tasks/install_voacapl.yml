- name: Install VOACAPL
  hosts: all
  tasks:

  # Two source builds lived here, and both were broken.
  #
  # voacapl was cloned and built with autoreconf, but nothing in the playbook
  # installs autoconf, automake or libtool -- build-essential does not carry
  # them -- so "autoreconf -f -i" fails as soon as the playbook is run on its
  # own rather than after something else that happened to pull them in.
  #
  # pythonprop was worse. Its version came from scraping the GitHub releases
  # page with grep -Po, which now returns nothing at all, so the download URL
  # became ".../archive/v.tar.gz". The scrape also carried a "warn: no"
  # argument, removed from ansible-core in 2.14, which failed the task before
  # the URL could even 404.
  #
  # Debian packages both: voacapl 0.7.6 and pythonprop 0.30.1. The
  # dependencies the source builds needed -- gfortran, cartopy, scipy,
  # matplotlib, yelp-tools -- go with them, and matplotlib in particular is
  # no longer pip-installed over the top of the distribution's own copy.
  - name: Install VOACAPL and pythonprop
    become: yes
    ansible.builtin.package:
      name: "{{ item }}"
      state: present
    with_items:
      - voacapl
      - pythonprop
    retries: 5
    delay: 30
    register: result
    until: result.failed == false

  # voacapl reads its coefficient and configuration files from ~/itshfbc,
  # which is per-user and created by makeitshfbc. This is deliberately run as
  # the ham user rather than root: a root-owned itshfbc in the operator's
  # home is a support call waiting to happen. install_user_skeleton.yml
  # copies it into /etc/skel afterwards, so accounts created on first boot of
  # a flashed image inherit it.
  - name: Create the VOACAPL data directory for the ham user
    ansible.builtin.command:
      cmd: makeitshfbc
      chdir: /home/{{ ham_user }}
      creates: /home/{{ ham_user }}/itshfbc

  - name: Check for the voacapgui desktop entry
    ansible.builtin.stat:
      path: /usr/share/applications/voacapgui.desktop
    register: voacapgui_desktop

  - name: Modify categories for voacapgui.desktop
    become: yes
    ansible.builtin.lineinfile:
      path: /usr/share/applications/voacapgui.desktop
      regexp: '^Categories=.*'
      line: Categories=HamRadio Calculators
    when: voacapgui_desktop.stat.exists
