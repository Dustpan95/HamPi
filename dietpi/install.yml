---
- name: Install the DietPi station foundation
  hosts: station
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Validate the generated station plan
      ansible.builtin.assert:
        that:
          - station_user is defined
          - station_user is match('^[a-z_][a-z0-9_-]{0,31}$')
          - station_user != 'root'
          - station_mode in ['desktop', 'services']
          - station_packages | length > 0
          - station_package_specs | length == station_packages | length
        fail_msg: Run this playbook through dietpi/station.py with a station configuration.

    - name: Check the actual target before making system changes
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/doctor.py --user {{ station_user }}"
        executable: /usr/bin/python3
      changed_when: false
      check_mode: false
      register: station_doctor

    - name: Retain the target facts
      ansible.builtin.set_fact:
        station_platform: "{{ station_doctor.stdout | from_json }}"

  roles:
    - role: packages
      become: true

  post_tasks:
    - name: Report the remaining station setup
      ansible.builtin.debug:
        msg:
          - Package foundation only; hardware operation has not been certified.
          - Configure the station user's desktop, audio devices and CAT/PTT before operating.
          - Remote sessions and image generation are tracked in dietpi/ROADMAP.md.
