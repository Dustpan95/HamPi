- name: Install flwrap
  hosts: all
  environment:
    # Build-Time Tuning:
    CXXFLAGS: -O2 -march=native -mtune=native
    CFLAGS: -O2 -march=native -mtune=native
    MAKEFLAGS: -j {{ shackwright_make_jobs }}
  tasks:

    - name: Create directory hamradio
      ansible.builtin.file:
        path: /home/{{ ham_user }}/hamradio
        state: directory
        mode: '0755'

    - name: Install dependent libraries
      become: yes
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      with_items:
        - build-essential
        - libfltk1.3-dev
        - libflxmlrpc-dev
      retries: 5
      delay: 30
      register: result
      until: result.failed == false

    - name: Build and install flwrap from source
      ansible.builtin.include_tasks: build_w1hkj_program.yml
      vars:
        w1hkj_program: flwrap
