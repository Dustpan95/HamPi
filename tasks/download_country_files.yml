- name: Download Amateur Radio Country Files
  hosts: all
  gather_facts: no
  tasks:

  - name: Create directory CTY_FILES
    file:
      path: /home/{{ ham_user }}/hamradio/CTY_FILES
      state: directory

  - name: Determine latest version of CTY_FILES on web
    shell: curl --silent "https://www.country-files.com/cty/download/" | grep -Po "\<a href=\"[0-9]+\/\"\>[0-9]+\/\<\/a\>" | tail -n 1 | grep -Po "[0-9]+" | uniq
    register: cty_version
    retries: 5
    delay: 30
    until: cty_version.failed == false

  - name: Download and Unarchive CTY {{ cty_version.stdout }} from http://www.country-files.com/
    unarchive:
      src: https://www.country-files.com/cty/download/{{ cty_version.stdout }}/cty-{{ cty_version.stdout }}.zip
      dest: /home/{{ ham_user }}/hamradio/CTY_FILES
      remote_src: yes
    retries: 5
    delay: 30
    register: result
    until: result.failed == false

  - name: Create FLDigi data directory
    file:
      path: /home/{{ ham_user }}/.fldigi
      state: directory

  - name: Create WSJT-X data directory
    file:
      path: /home/{{ ham_user }}/.local/share/WSJT-X
      state: directory

  - name: Copy cty.dat to FLDigi
    shell: cp /home/{{ ham_user }}/hamradio/CTY_FILES/cty.dat /home/{{ ham_user }}/.fldigi

  - name: Copy cty.dat to WSJT-X
    shell: cp /home/{{ ham_user }}/hamradio/CTY_FILES/cty.dat /home/{{ ham_user }}/.local/share/WSJT-X

  # The BIGCTY block had the year baked into it, in both the pattern it
  # searched for and the URL it built:
  #
  #   grep -Po "https://www.country-files.com/bigcty/download/2023/bigcty-[0-9]+.zip"
  #   src: https://www.country-files.com/bigcty/download/2023/bigcty-{{ ... }}.zip
  #
  # country-files.com files each release under the year it was published, so
  # the pattern stopped matching anything the moment 2023 ended and the
  # download has been broken for every release since. It is 2026.
  #
  # The whole URL is taken from the page now rather than reassembled from a
  # fragment of it, so the year is whatever the site says it is.
  #
  # The neighbouring CTY lookup above is left alone. Its "3630" looks like a
  # corrupt year but is not -- country-files.com numbers CTY releases
  # sequentially, 3630 is the current one, and that URL returns 200. It was
  # checked before being touched.
  - name: Find the current BIGCTY release
    ansible.builtin.shell:
      cmd: >-
        curl -fsSL "https://www.country-files.com/"
        | grep -oP 'https://www\.country-files\.com/bigcty/download/[0-9]{4}/bigcty-[0-9]+\.zip'
        | head -1
      executable: /bin/bash
    register: bigcty_lookup
    changed_when: false
    failed_when: false
    retries: 3
    delay: 15
    until: bigcty_lookup.rc == 0

  - name: Refuse to continue without a real BIGCTY URL
    ansible.builtin.assert:
      that:
        - bigcty_lookup.stdout | trim is match('^https://www\.country-files\.com/bigcty/download/[0-9]{4}/bigcty-[0-9]+\.zip$')
      fail_msg: >-
        Could not find a BIGCTY download on country-files.com. Got
        '{{ bigcty_lookup.stdout | trim }}'.
      success_msg: "{{ bigcty_lookup.stdout | trim }}"

  - name: Download and unarchive the current Big CTY
    ansible.builtin.unarchive:
      src: "{{ bigcty_lookup.stdout | trim }}"
      dest: /home/{{ ham_user }}/hamradio/CTY_FILES
      remote_src: yes
    retries: 5
    delay: 30
    register: result
    until: result.failed == false
