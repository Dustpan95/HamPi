- name: Install fldigi
  hosts: all
  environment:
    # Build-Time Tuning:
    CXXFLAGS: -O2 -march=native -mtune=native
    CFLAGS: -O2 -march=native -mtune=native
    MAKEFLAGS: -j {{ shackwright_make_jobs }}
  tasks:

    - name: Create directory hamradio
      ansible.builtin.file:
        path: /home/{{ ham_user }}/hamradio
        state: directory
        mode: '0755'

    - name: Install dependent libraries
      become: yes
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      with_items:
        - build-essential
        - libfltk1.3-dev
        - libsamplerate0-dev
        - portaudio19-dev
        - libsndfile1-dev
        - libxft-dev
        - libxinerama-dev
        - libxcursor-dev
        - libusb-1.0-0-dev
        - libpulse-dev
        - pavucontrol
        - libflxmlrpc-dev
      retries: 5
      delay: 30
      register: result
      until: result.failed == false

    - name: Build and install fldigi from source
      ansible.builtin.include_tasks: build_w1hkj_program.yml
      vars:
        w1hkj_program: fldigi

    # fldigi ships a second program, flarq, with its own desktop entry.
    - name: Check for the flarq desktop entry
      ansible.builtin.stat:
        path: /usr/share/applications/flarq.desktop
      register: flarq_desktop

    - name: File flarq under HamRadio in the menu
      become: yes
      ansible.builtin.lineinfile:
        path: /usr/share/applications/flarq.desktop
        regexp: '^Categories=.*'
        line: Categories=HamRadio Fldigi
      when: flarq_desktop.stat.exists
