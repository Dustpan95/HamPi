---
name: Build Raspberry Pi image

# Builds a flashable Raspberry Pi OS image on a native arm64 runner.
#
# No Raspberry Pi is involved. The official Raspberry Pi OS image is
# downloaded, grown, loop-mounted, and the playbook is run against it through
# Ansible's chroot connection. Because the runner is aarch64 and so is the
# image, this is native execution -- no QEMU, no emulation penalty.
#
# Manual only. A job is capped at six hours; the app list is an input so a
# run can be sized to fit.

on:
  # Dispatching a workflow needs actions: write, which is not available here,
  # so a path-filtered push on this file is the only way to start a run. One
  # run per edit, nothing else.
  push:
    branches: [BetaTesting]
    paths: ['.github/workflows/build-image.yml']
  workflow_dispatch:
    inputs:
      playbooks:
        description: 'Comma-separated playbooks under tasks/ to install'
        required: true
        default: 'install_soapy,install_hamlib'
      image_size:
        description: 'Grow the image to this size before installing'
        required: false
        default: '16G'
      base_image:
        description: 'Base image: raspios_arm64_latest (desktop) or raspios_lite_arm64_latest'
        required: false
        default: 'raspios_arm64_latest'

permissions:
  # write, because a successful build publishes its image as a release.
  contents: write

jobs:
  image:
    name: Build image on native arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    env:
      MNT: /mnt/shackwright
      IMG: shackwright.img

    steps:
      - uses: actions/checkout@v4

      - name: Report the machine
        run: |
          echo "arch: $(uname -m), $(nproc) cores, \
          $(free -g | awk '/Mem:/{print $2}') GB RAM"
          df -h / | tail -1

      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: Install host tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq parted xz-utils e2fsprogs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Ansible and collections
        run: |
          python3 -m pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Download the base Raspberry Pi OS image
        run: |
          url="https://downloads.raspberrypi.com/${{ inputs.base_image || 'raspios_arm64_latest' }}"
          echo "Resolving ${url}"
          curl -fsSIL "$url" | grep -i '^location:' | tail -1
          curl -fL --retry 3 -o base.img.xz "$url"
          ls -lh base.img.xz
          echo "Decompressing ..."
          xz -d --stdout base.img.xz > "$IMG"
          rm -f base.img.xz
          ls -lh "$IMG"

      - name: Grow the image and its root filesystem
        id: mount
        run: |
          set -x
          # The stock image is sized to its contents; the applications need room.
          truncate -s "${{ inputs.image_size || '16G' }}" "$IMG"
          sudo parted -s "$IMG" resizepart 2 100%

          loop=$(sudo losetup -Pf --show "$IMG")
          echo "loop=$loop" >> "$GITHUB_OUTPUT"
          sudo e2fsck -pf "${loop}p2" || true
          sudo resize2fs "${loop}p2"

          sudo mkdir -p "$MNT"
          sudo mount "${loop}p2" "$MNT"
          # Trixie puts the firmware partition here; older layouts used /boot.
          if [ -d "$MNT/boot/firmware" ]; then
            sudo mount "${loop}p1" "$MNT/boot/firmware"
          else
            sudo mount "${loop}p1" "$MNT/boot"
          fi
          for d in proc sys dev dev/pts run; do
            sudo mount --bind "/$d" "$MNT/$d"
          done
          df -h "$MNT"

      - name: Prepare the chroot
        run: |
          # Raspberry Pi OS preloads libarmmem, which is built for the Pi's
          # own memory layout and makes every command in the chroot fail on
          # any other machine. pi-gen does exactly this.
          if [ -f "$MNT/etc/ld.so.preload" ]; then
            sudo mv "$MNT/etc/ld.so.preload" "$MNT/etc/ld.so.preload.disabled"
          fi

          # Stop packages starting services inside the chroot.
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$MNT/usr/sbin/policy-rc.d" >/dev/null
          sudo chmod +x "$MNT/usr/sbin/policy-rc.d"

          # Platform detection reads /proc/device-tree/model, and /proc here is
          # the runner's, which has no device tree. Give it the fixture hook
          # that library/set_facts.yml already supports, so the image is built
          # as what it actually is: a Raspberry Pi.
          printf 'Raspberry Pi 5 Model B Rev 1.0\0' \
            | sudo tee "$MNT/etc/shackwright-pi-model" >/dev/null

      - name: Refresh the package index inside the image
        # The base image ships the apt lists it was built with. Debian moves
        # on: by the time the image is used, the exact versions those lists
        # name have been superseded and removed from the pool, and every
        # install 404s. The first build failed exactly this way, on
        # libxml2-dev, liblzma-dev and libxpm-dev.
        #
        # Updating the index is the minimum. Upgrading as well means the image
        # ships current packages rather than whatever was current on the day
        # the base image was cut, which for a security-relevant thing like an
        # SSH server matters.
        run: |
          sudo chroot "$MNT" apt-get update
          sudo chroot "$MNT" apt-get -y \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            dist-upgrade
          sudo chroot "$MNT" apt-get -y autoremove

      - name: Install Shackwright into the image
        id: install
        run: |
          mkdir -p ansible-output
          rc=0
          IFS=',' read -ra list <<< "${{ inputs.playbooks || 'install_soapy,install_hamlib' }}"
          for name in "${list[@]}"; do
            name="$(echo "$name" | xargs)"
            [ -n "$name" ] || continue
            echo "::group::$name"
            started=$(date +%s)
            sudo -E "$(command -v ansible-playbook)" \
              -i "${MNT}," -c community.general.chroot \
              -e ham_user=pi \
              -e pi_model_path=/etc/shackwright-pi-model \
              -e ansible_python_interpreter=/usr/bin/python3 \
              library/set_facts.yml "tasks/${name}.yml" \
              2>&1 | tee "ansible-output/${name}.log"
            status=${PIPESTATUS[0]}
            echo $(( $(date +%s) - started )) > "ansible-output/${name}.seconds"
            [ "$status" -eq 0 ] || { echo "RESULT ${name}: FAIL"; rc=1; }
            [ "$status" -eq 0 ] && echo "RESULT ${name}: PASS"
            echo "::endgroup::"
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Seed /etc/skel inside the image
        # Raspberry Pi OS ships no default account; the first-boot wizard
        # creates one and the operator picks the name. Without this, every
        # desktop entry, menu and config the build produced sits in an
        # orphaned /home/pi that the new account cannot see, and the image
        # looks broken for any operator who does not happen to choose "pi".
        run: |
          sudo -E "$(command -v ansible-playbook)" \
            -i "${MNT}," -c community.general.chroot \
            -e ham_user=pi \
            -e pi_model_path=/etc/shackwright-pi-model \
            -e ansible_python_interpreter=/usr/bin/python3 \
            -e shackwright_image_build=true \
            library/set_facts.yml tasks/install_user_skeleton.yml \
            2>&1 | tee ansible-output/install_user_skeleton.log
          exit ${PIPESTATUS[0]}

      - name: Finalize and unmount
        if: always()
        run: |
          set -x
          sudo rm -f "$MNT/usr/sbin/policy-rc.d"
          if [ -f "$MNT/etc/ld.so.preload.disabled" ]; then
            sudo mv "$MNT/etc/ld.so.preload.disabled" "$MNT/etc/ld.so.preload"
          fi
          sudo rm -f "$MNT/etc/shackwright-pi-model"

          # Every flashed card must have its own SSH identity.
          sudo rm -f "$MNT"/etc/ssh/ssh_host_*
          sudo rm -rf "$MNT"/var/cache/apt/archives/*.deb
          sudo rm -rf "$MNT"/var/log/*.log "$MNT"/var/log/journal/* || true

          # Zero the free space so the image compresses to near its real size.
          sudo dd if=/dev/zero of="$MNT/zero.fill" bs=4M status=none || true
          sudo rm -f "$MNT/zero.fill"
          sudo sync

          for d in run dev/pts dev sys proc; do sudo umount -l "$MNT/$d" || true; done
          sudo umount "$MNT/boot/firmware" 2>/dev/null || sudo umount "$MNT/boot" || true
          sudo umount "$MNT" || true
          sudo losetup -d "${{ steps.mount.outputs.loop }}" || true

      - name: Boot the image under QEMU
        # The one check continuous integration can make that resembles a real
        # user's first five minutes: does this thing actually come up?
        #
        # -M raspi3b, not raspi4b: Ubuntu 24.04 ships QEMU 8.2, and raspi4b
        # only arrived in QEMU 9.0. raspi3b models a Cortex-A53 with 1 GiB,
        # which is enough to answer the question that matters -- whether the
        # root filesystem mounts and userspace starts. QEMU's SD emulation
        # also insists on a power-of-two image, which 16 GiB satisfies.
        #
        # This does not exercise the Pi bootloader, the VideoCore firmware,
        # GPIO, audio or any radio hardware. It cannot replace putting the
        # card in a Pi. What it does catch is the class of failure that makes
        # an image useless to everyone: a root filesystem that will not mount,
        # a broken package state, a system that never reaches userspace.
        #
        # Deliberately not a gate. It reports what it saw and does not fail
        # the build, because a QEMU quirk should not block an image that is
        # otherwise fine. Read the log.
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -x
          sudo apt-get install -y -qq qemu-system-arm
          loop=$(sudo losetup -Pf --show "$IMG")
          mkdir -p qemu boot-mnt
          sudo mount "${loop}p1" boot-mnt
          # Trixie ships several kernels; take the 64-bit one that raspi3b can
          # run, and its matching device tree.
          cp boot-mnt/kernel8.img qemu/ 2>/dev/null || cp boot-mnt/kernel_2712.img qemu/kernel8.img 2>/dev/null || true
          cp boot-mnt/bcm2710-rpi-3-b-plus.dtb qemu/ 2>/dev/null || true
          cp boot-mnt/initramfs8 qemu/ 2>/dev/null || true
          ls -la qemu/ boot-mnt/ | head -30
          sudo umount boot-mnt
          sudo losetup -d "$loop"

          if [ ! -f qemu/kernel8.img ] || [ ! -f qemu/bcm2710-rpi-3-b-plus.dtb ]; then
            echo "No 64-bit kernel or device tree in the boot partition; cannot boot here."
            exit 0
          fi

          initrd_arg=""
          [ -f qemu/initramfs8 ] && initrd_arg="-initrd qemu/initramfs8"

          set +e
          timeout 900 qemu-system-aarch64 \
            -M raspi3b \
            -kernel qemu/kernel8.img \
            -dtb qemu/bcm2710-rpi-3-b-plus.dtb \
            $initrd_arg \
            -drive file="$IMG",format=raw,if=sd \
            -append "rw earlyprintk loglevel=8 console=ttyAMA0,115200 root=/dev/mmcblk0p2 rootfstype=ext4 rootwait fsck.repair=yes systemd.unit=multi-user.target" \
            -serial mon:stdio -nographic -no-reboot \
            > qemu/console.log 2>&1
          echo "qemu exited: $?"
          set -e

          echo "==================== BOOT CONSOLE (tail) ===================="
          tail -n 60 qemu/console.log || true
          echo "============================================================="
          echo "### Boot markers"
          for marker in "Linux version" "Mounted /" "systemd" "Reached target" "login:" "Welcome to"; do
            n=$(grep -c "$marker" qemu/console.log 2>/dev/null || echo 0)
            printf '  %-20s %s\n' "$marker" "$n"
          done

      - name: Upload the boot console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-console
          path: qemu/console.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Package the image
        if: always()
        run: |
          [ -f "$IMG" ] || { echo "no image produced"; exit 1; }
          sudo chown "$USER" "$IMG"
          version="0.0.0-ci-${GITHUB_RUN_NUMBER}"
          packaging_utilities/package_release.sh "$IMG" "$version" release
          ls -lh release/

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Raspberry Pi image build"
            echo
            echo "| Playbook | Result | ok | changed | failed | Duration |"
            echo "|---|---|---|---|---|---|"
            for log in ansible-output/*.log; do
              [ -f "$log" ] || continue
              name=$(basename "$log" .log)
              recap=$(grep -oE 'ok=[0-9]+ +changed=[0-9]+ +unreachable=[0-9]+ +failed=[0-9]+' "$log" | tail -1)
              ok=$(echo "$recap" | grep -oE 'ok=[0-9]+' | cut -d= -f2)
              ch=$(echo "$recap" | grep -oE 'changed=[0-9]+' | cut -d= -f2)
              fa=$(echo "$recap" | grep -oE 'failed=[0-9]+' | cut -d= -f2)
              du=$(cat "ansible-output/${name}.seconds" 2>/dev/null || echo '?')
              if [ "${fa:-1}" = "0" ]; then v='pass'; else v='**FAIL**'; fi
              echo "| \`${name}\` | ${v} | ${ok:-?} | ${ch:-?} | ${fa:-?} | ${du}s |"
            done
            echo
            echo "### Artifacts"
            echo '```'
            ls -lh release/ 2>/dev/null || echo 'none produced'
            echo '```'
            echo
            echo "_Built by chroot on an arm64 runner. Not yet booted on hardware._"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shackwright-image
          path: release/
          retention-days: 7

      - name: Publish the image as a prerelease
        # Releases, not git. The image is one to two gigabytes; GitHub rejects
        # files over 100 MB in git, and even through LFS it would sit in the
        # repository forever and be paid for on every clone. A release asset
        # is the right home, and package_release.sh has already split the
        # image into parts under the 2 GiB per-asset limit.
        #
        # Marked prerelease, and named so, because nothing here has been
        # booted. It is a build artifact people can flash and try, not a
        # release anyone should be told is finished.
        if: steps.install.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="image-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --title "Untested image build ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "$(cat <<'NOTES'
          Automated image build. **Not booted on hardware. Not a release.**

          Built by chroot on a native arm64 runner from the official
          Raspberry Pi OS Trixie arm64 image, with the package index
          refreshed and the system dist-upgraded first.

          Verify and flash per the RELEASE.md asset included here. If the
          image is split into parts, reassemble them before flashing.

          If you boot this, please report what happens — that is the one
          thing continuous integration cannot establish.
          NOTES
          )" \
            release/* || {
              echo "Release publish failed; the image is still available as a workflow artifact."
              exit 0
            }
          echo "Published $tag"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-logs
          path: ansible-output/
          retention-days: 14

      - name: Report failures and fail the job
        # Printed here, as the last step, deliberately. Earlier revisions put
        # this in the Summarize step, which sits above the artifact uploads --
        # far enough up a long log that the reason a build failed could not be
        # read back without downloading the artifact. Last step means the tail
        # of the log is the diagnosis.
        if: always()
        run: |
          rc=0
          for log in ansible-output/*.log; do
            [ -f "$log" ] || continue
            name=$(basename "$log" .log)
            f=$(grep -oE 'failed=[0-9]+' "$log" | tail -1 | cut -d= -f2)
            if [ "${f:-1}" != "0" ]; then
              rc=1
              echo "=============================================================="
              echo "FAILED: ${name}"
              echo "=============================================================="
              # The last TASK banner before the failure, then the tail, which
              # carries the error and the recap whatever wording Ansible used.
              awk '/failed=[1-9]/{exit} /^TASK \[/{t=$0} END{print "Last task started: " t}' "$log"
              echo "--------------------------------------------------------------"
              tail -n 40 "$log"
              echo
            else
              echo "OK: ${name}"
            fi
          done
          exit "$rc"
