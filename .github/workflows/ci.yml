---
name: CI

# Shackwright compiles most of a ham radio station from source, which takes
# hours on real hardware and cannot run on a GitHub runner. CI therefore verifies everything
# that can be checked without a Pi: that the YAML parses, that the playbook
# graph resolves, that the linters are satisfied, and that platform detection
# still selects the right branch for each supported board and OS release.

on:
  push:
    branches: [master, BetaTesting, Testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: python3 -m pip install -r requirements.txt

      - name: yamllint
        # Not --strict: the tree carries ~130 cosmetic warnings (list
        # indentation, comment spacing) inherited from six years of hand
        # editing. They are surfaced in the log but do not fail the build.
        # Anything yamllint rates an error, including duplicate keys, does.
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  syntax:
    name: Playbook syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: python3 -m pip install -r requirements.txt

      - name: Resolve and syntax-check the full playbook graph
        run: ansible-playbook -i 'localhost,' --syntax-check tasks/main.yml

      - name: Syntax-check every playbook individually
        # main.yml only imports about two thirds of tasks/. The rest are
        # disabled imports awaiting repair; they still have to parse so that
        # re-enabling one is a one-line change rather than a debugging session.
        run: |
          rc=0
          for playbook in tasks/*.yml library/*.yml; do
            case "$playbook" in
              tasks/main.yml) continue ;;
              tasks/build_HamClock_by_WB0OEW.yml) continue ;;
              tasks/build_w1hkj_program.yml) continue ;;
              tasks/install_librtlsdr.yml) continue ;;
              library/install_buster_repo.yml) continue ;;
            esac
            if ! out=$(ansible-playbook -i 'localhost,' --syntax-check "$playbook" 2>&1); then
              echo "::error file=${playbook}::syntax check failed"
              echo "$out"
              rc=1
            fi
          done
          exit $rc

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: python3 -m pip install -r requirements.txt

      - name: Run platform detection tests
        run: ./tests/run_tests.sh

      - name: Run /etc/skel seeding tests
        # Guards what every account created from a released image inherits,
        # and in particular what it must not: the build user's shell history,
        # SSH keys or credential caches.
        run: ./tests/test_skel.sh

      - name: Check for removed Ansible arguments and dead download hosts
        # "warn" was removed from command and shell in ansible-core 2.14 and
        # fails the task outright. It was here 39 times across 31 files, 27 of
        # them imported by main.yml, so a quarter of a full run could not
        # succeed on any Ansible newer than November 2022. The w1hkj.com
        # check covers the fldigi suite's download host, which is gone.
        run: ./tests/test_removed_ansible_args.sh

      - name: Run release packaging tests
        # Covers the split-and-reassemble path. A release the downloader
        # cannot put back together would only fail after several gigabytes
        # of download, so the round trip is checked on every push.
        run: ./tests/test_packaging.sh
